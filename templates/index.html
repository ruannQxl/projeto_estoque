<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Estoque</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; color: #333; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #fff; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #0056b3; color: white; }
        a { color: #0056b3; text-decoration: none; }
        a:focus, button:focus { outline: 3px solid #ffbf47; }
        .nav-links { margin-bottom: 20px; }
    </style>
</head>
<body>
    <main>
        <h1>Itens em Estoque</h1>
        <nav class="nav-links" aria-label="Navegação principal">
            <a href="/cadastro" aria-label="Cadastrar novo item no estoque">Cadastrar Novo Item</a> | 
            <a href="/login/google" aria-label="Fazer login utilizando API do Google">Login com Google</a>
        </nav>
        <table>
            <caption>Relação dos produtos cadastrados no sistema</caption>
            <thead>
                <tr>
                    <th scope="col">Nome</th>
                    <th scope="col">Quantidade</th>
                    <th scope="col">Preço</th>
                    <th scope="col">Data</th>
                    <th scope="col">Ações</th>
                </tr>
            </thead>
            <tbody>
                {% for item in itens %}
                <tr>
                    <td>{{ item[1] }}</td>
                    <td>{{ item[2] }}</td>
                    <td>R$ {{ item[3] }}</td>
                    <td>{{ item[4] }}</td>
                    <td><a href="/editar/{{ item[0] }}" aria-label="Editar item {{ item[1] }}">Editar</a></td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="5">Nenhum item cadastrado.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </main>
</body>
</html>
