<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque - Manutenção</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; color: #333; margin: 0; }
        header { background-color: #0056b3; color: white; padding: 20px; text-align: center; }
        main { padding: 30px; max-width: 800px; margin: 0 auto; background: white; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin-top: 20px;}
        .botao-add { background-color: #28a745; color: white; padding: 12px 20px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; margin-bottom: 20px; }
        .botao-add:hover { background-color: #218838; }
        /* Estilos da nova tabela */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: center; }
        th { background-color: #0056b3; color: white; }
    </style>
</head>
<body>
    <header>
        <h1>Painel de Estoque</h1>
        <p>Controle de Peças - Celulares e PCs</p>
    </header>
    
    <main>
        <h2>Resumo do Estoque</h2>
        <p>Gerencie as telas, baterias e placas da loja.</p>
        
        <a href="/cadastrar" style="text-decoration: none;">
            <button class="botao-add" aria-label="Cadastrar uma nova peça no estoque">
                + Cadastrar Nova Peça
            </button>
        </a>

        <!-- Tabela que mostra os dados do banco -->
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome da Peça</th>
                    <th>Quantidade</th>
                    <th>Preço (R$)</th>
                </tr>
            </thead>
            <tbody>
                <!-- Este bloco de código conversa com o Python para listar as peças -->
                {% for peca in pecas %}
                <tr>
                    <td>{{ peca[0] }}</td>
                    <td>{{ peca[1] }}</td>
                    <td>{{ peca[2] }}</td>
                    <td>R$ {{ peca[3] }}</td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="4">Nenhuma peça cadastrada ainda.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </main>
</body>
</html>
