<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Peça - TechFix</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; }
        form { background: white; max-width: 400px; margin: 0 auto; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        label { font-weight: bold; display: block; margin-top: 15px; }
        input { width: 90%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #28a745; color: white; padding: 12px; margin-top: 25px; border: none; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; }
        button:hover { background-color: #218838; }
        .voltar { display: block; text-align: center; margin-top: 15px; color: #0056b3; text-decoration: none; }
    </style>
</head>
<body>
    <form action="/cadastrar" method="POST">
        <h2>Adicionar Nova Peça</h2>
        
        <label for="nome">Nome da Peça:</label>
        <input type="text" id="nome" name="nome" placeholder="Ex: Tela iPhone 11" required>
        
        <label for="quantidade">Quantidade no Estoque:</label>
        <input type="number" id="quantidade" name="quantidade" required>
        
        <label for="preco">Preço (R$):</label>
        <input type="number" step="0.01" id="preco" name="preco" required>
        
        <button type="submit">Salvar no Banco de Dados</button>
        <a href="/" class="voltar">Voltar para o Início</a>
    </form>
</body>
</html>
