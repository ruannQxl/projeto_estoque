<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechFix - Cadastro de Peças</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-app: #f8fafc;
            --header-bg: #0f172a;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --border-color: #e2e8f0;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-app); 
            color: var(--text-main); 
            margin: 0; padding: 0;
        }

        nav {
            background-color: var(--header-bg); color: white; padding: 18px 32px;
            display: flex; align-items: center; gap: 12px;
        }
        .nav-logo {
            background: linear-gradient(135deg, #2563eb, #06b6d4); color: white;
            width: 38px; height: 38px; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; font-weight: 700;
        }

        main { max-width: 650px; margin: 40px auto; padding: 0 20px; }

        .card-form {
            background: var(--card-bg); padding: 35px; border-radius: 16px;
            border: 1px solid var(--border-color); box-shadow: var(--shadow);
        }

        h2 { margin-top: 0; font-size: 22px; font-weight: 700; }
        p.subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 25px; }

        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 8px; color: var(--text-main); }
        
        input {
            width: 100%; padding: 12px 16px; border: 1px solid var(--border-color);
            border-radius: 8px; font-size: 14px; background-color: #f8fafc; transition: all 0.2s;
            box-sizing: border-box;
        }
        input:focus { outline: none; border-color: var(--primary); background-color: white; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }

        .form-row { display: flex; gap: 15px; }
        .form-row .form-group { flex: 1; }

        .btn-group { display: flex; gap: 12px; margin-top: 30px; }
        
        .btn-submit {
            background-color: var(--primary); color: white; border: none; padding: 12px 24px;
            border-radius: 8px; font-weight: 600; cursor: pointer; flex: 1; transition: background 0.2s;
        }
        .btn-submit:hover { background-color: var(--primary-hover); }

        .btn-cancel {
            background-color: #e2e8f0; color: var(--text-main); text-decoration: none; padding: 12px 24px;
            border-radius: 8px; font-weight: 600; text-align: center; display: inline-block; transition: background 0.2s;
        }
        .btn-cancel:hover { background-color: #cbd5e1; }
    </style>
</head>
<body>

    <nav>
        <div class="nav-logo">TF</div>
        <span style="font-weight: 700; font-size: 18px;">TechFix Enterprise</span>
    </nav>
    
    <main>
        <div class="card-form">
            <h2>Cadastrar Novo Componente</h2>
            <p class="subtitle">Preencha os dados do item e o endereço de origem para registro.</p>
            
            <form action="/cadastrar" method="POST">
                <div class="form-group">
                    <label for="nome">Nome da Peça (Ex: Tela iPhone 13 / SSD 512GB)</label>
                    <input type="text" id="nome" name="nome" required placeholder="Digite o nome do componente">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="quantidade">Quantidade</label>
                        <input type="number" id="quantidade" name="quantidade" required placeholder="0">
                    </div>
                    <div class="form-group">
                        <label for="preco">Preço Unitário (R$)</label>
                        <input type="number" step="0.01" id="preco" name="preco" required placeholder="0.00">
                    </div>
                </div>

                <div class="form-group">
                    <label for="cep">CEP</label>
                    <input type="text" id="cep" name="cep" placeholder="Digite o CEP (Apenas números)" maxlength="8">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="rua">Rua / Logradouro</label>
                        <input type="text" id="rua" name="rua" placeholder="Preenchido automaticamente">
                    </div>
                    <div class="form-group">
                        <label for="bairro">Bairro</label>
                        <input type="text" id="bairro" name="bairro" placeholder="Preenchido automaticamente">
                    </div>
                </div>

                <div class="btn-group">
                    <a href="/" class="btn-cancel">Cancelar</a>
                    <button type="submit" class="btn-submit">Salvar Peça</button>
                </div>
            </form>
        </div>
    </main>

    <!-- Script JavaScript para ViaCEP -->
    <script>
        const inputCep = document.getElementById('cep');
        inputCep.addEventListener('blur', function() {
            let cepLimpo = inputCep.value.replace(/\D/g, '');
            if (cepLimpo.length === 8) {
                fetch(`https://viacep.com.br/ws/${cepLimpo}/json/`)
                    .then(response => response.json())
                    .then(dados => {
                        if (!dados.erro) {
                            document.getElementById('rua').value = dados.logradouro;
                            document.getElementById('bairro').value = dados.bairro;
                        } else {
                            alert('CEP não encontrado!');
                        }
                    });
            }
        });
    </script>
</body>
</html>
